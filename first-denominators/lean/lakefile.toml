name = "FirstDenominators"
defaultTargets = ["FirstDenominators", "Axioms"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[lean_lib]]
name = "FirstDenominators"
roots = ["FirstDenominators"]
globs = ["FirstDenominators", "FirstDenominators.+"]
leanOptions = { autoImplicit = false }

[[lean_lib]]
name = "Axioms"
